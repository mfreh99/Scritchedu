<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة سكراتش التعليمية</title>
<style>
:root{--bg:#f4f6fb;--pn:#fff;--tx:#1f2937;--bd:#d8dde8;--mut:#6b7280;--gold:#FFD500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161c;--pn:#1e222b;--tx:#e8eaf0;--bd:#343a48;--mut:#9aa3b5}}
:root[data-theme=dark]{--bg:#14161c;--pn:#1e222b;--tx:#e8eaf0;--bd:#343a48;--mut:#9aa3b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0}.sp{flex:1}.les{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;background:var(--bd);color:var(--tx)}
.btn.on{background:#4C97FF;color:#fff}.flag{background:#2fb344;color:#fff;font-weight:700}.stop{background:#e5484d;color:#fff}
main{flex:1;display:grid;grid-template-columns:210px minmax(260px,1fr) minmax(300px,480px);gap:10px;padding:10px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px;min-width:0}
.cats,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cat{border-bottom:4px solid var(--cc)}.cat.on{background:var(--cc);color:#fff}
.blk{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;color:#fff;font-weight:600;margin:5px 0;cursor:grab;user-select:none;font-size:14px}
.blk.active{background:#FFD500!important;color:#222;box-shadow:0 0 12px 3px var(--gold)}
.hat{background:#FFBF00;color:#222;border-radius:18px 18px 8px 8px;cursor:default}
.blk input{width:56px;border:0;border-radius:6px;padding:2px 6px;font:inherit;text-align:center;color:#222;background:#fff}
.blk input[type=text]{width:110px}.blk input[type=color]{width:34px;height:24px;padding:0}
.cont{display:block}.hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kids{min-height:34px;margin:6px 16px 2px 0;padding:2px 8px;background:rgba(0,0,0,.2);border-radius:8px}
.drop{outline:2px dashed var(--gold)}
.del{margin-inline-start:auto;background:rgba(0,0,0,.25);border:0;color:inherit;border-radius:50%;width:22px;height:22px;cursor:pointer}
.script{min-height:300px;padding:4px}.mut{color:var(--mut);font-size:13px}
pre{direction:ltr;text-align:left;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow-x:auto;min-height:280px;margin:0;font-size:13px}
.stage{position:relative;aspect-ratio:4/3;background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.sprite{position:absolute;font-size:34px;line-height:1;transform:translate(-50%,-50%)}.sprite span{display:inline-block}
.bubble{position:absolute;background:#fff;color:#222;border:2px solid #888;border-radius:14px;padding:4px 10px;transform:translate(-50%,-150%);white-space:nowrap;display:none;font-size:14px}
.foot{position:sticky;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--pn);border-top:1px solid var(--bd);display:flex;justify-content:center;align-items:center;gap:14px}
.big{background:#7c5cff;color:#fff;font-size:17px;padding:12px 28px;border-radius:999px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.ov.on{display:flex}
.md{background:var(--pn);border-radius:14px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}
.md h2{margin:0 0 6px;font-size:18px}label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
.md input{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
.wa{background:#25D366;color:#073b1c;font-weight:700;width:100%;margin-top:14px;padding:12px}
#st{margin-top:10px;font-size:14px}#st a{color:#25a05a;font-weight:700}
.start{background:#7c5cff;color:#fff;font-weight:700}
#ph,label[for=ph]{display:none}
.blk select{border:0;border-radius:6px;padding:2px 4px;font:inherit;color:#222;background:#fff}
.pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px}
.pick button{border:2px solid var(--bd);background:var(--bg);border-radius:10px;font-size:22px;line-height:1;padding:4px 7px;cursor:pointer}
.pick button.on{border-color:#4C97FF;box-shadow:0 0 0 2px #4C97FF}
.pick button.bg{width:34px;height:34px;border-radius:50%;padding:0}
</style></head><body>
<header class="top"><h1>🧩 منصة سكراتش التعليمية</h1><button class="btn start" id="start">▶ بدء</button><div class="les" id="les"></div><span class="sp"></span>
<button class="btn flag" id="go">🏁 تشغيل</button><button class="btn stop" id="stp">⏹ إيقاف</button></header>
<main>
<section class="panel"><div class="cats" id="cats"></div><div id="pal"></div><p class="mut">انقر على اللبنة لإضافتها، أو اسحبها وأفلتها (حتى داخل «كرر»).</p></section>
<section class="panel"><div class="tabs"><button class="btn on" data-t="scr">اللبنات</button><button class="btn" data-t="cod">الكود النصي (JS)</button></div>
<div id="scrw"><div id="scr" class="script"></div></div><pre id="codw" hidden><code id="cd"></code></pre></section>
<section class="panel"><div class="stage"><canvas id="cv" width="480" height="360"></canvas><div class="sprite" id="spr"><span id="rot">🤖</span></div><div class="bubble" id="bub"></div></div>
<div class="pick"><b>الكائن:</b><span id="spp" style="display:contents"></span></div><div class="pick"><b>الخلفية:</b><span id="bgp" style="display:contents"></span></div><p class="mut">منصة العرض: اضغط 🏁 لتشغيل الكود خطوة بخطوة.</p></section>
</main>
<footer class="foot"><span class="mut" id="fc"></span><button class="btn big" id="pj">📋 بيانات المشروع</button></footer>
<div class="ov" id="ov"><div class="md"><h2>📋 بيانات المشروع</h2>
<label for="ln">اسم التدريب</label><input id="ln" type="text">
<label for="sn">اسم الطالب</label><input id="sn" type="text" placeholder="اكتب اسمك هنا">
<label for="ph">رقم واتساب المعلم (اختياري، بصيغة دولية بدون +)</label><input id="ph" type="tel" inputmode="numeric" dir="ltr" style="text-align:left">
<p>🧱 عدد اللبنات المستخدمة: <b id="bc">0</b></p>
<button class="btn wa" id="wa">📤 إرسال المشروع عبر واتساب</button><div id="st"></div>
<button class="btn" id="ex" style="margin-top:10px;width:100%">💾 تصدير المشروع كملف (.json)</button><button class="btn" id="cl" style="margin-top:10px;width:100%">إغلاق</button></div></div>
<script>
const $=id=>document.getElementById(id);
const D={
move:{c:'m',p:['تحرّك',{k:'v',n:1,d:50},'خطوة']},
right:{c:'m',p:['استدر يميناً',{k:'v',n:1,d:90},'°']},
left:{c:'m',p:['استدر يساراً',{k:'v',n:1,d:90},'°']},
home:{c:'m',p:['اذهب إلى المنتصف']},
say:{c:'l',p:['قل',{k:'v',d:'مرحباً!'},'لمدة',{k:'w',n:1,d:2},'ثانية']},
wait:{c:'c',p:['انتظر',{k:'v',n:1,d:1},'ثانية']},
sprite:{c:'l',p:['غيّر الكائن إلى',{k:'v',sp:1,d:'1'}]},bg:{c:'l',p:['غيّر الخلفية إلى',{k:'v',bg:1,d:'1'}]},repeat:{c:'c',box:1,p:['كرر',{k:'v',n:1,d:4},'مرات']},
pd:{c:'p',p:['أنزل القلم']},pu:{c:'p',p:['ارفع القلم']},
col:{c:'p',p:['لوّن القلم',{k:'v',col:1,d:'#e5484d'}]},clr:{c:'p',p:['امسح الرسم']}};
const CAT={m:['حركة','#4C97FF'],l:['مظهر','#9966FF'],c:['تحكم','#FFAB19'],p:['قلم','#0FBD8C']};
let script=[],uid=1,drag=null,cur='m',lesson='',run=0,st;
function mk(t,v,w,kids){const n={id:uid++,t,kids:kids||[]};D[t].p.forEach(x=>{if(x.k)n[x.k]=x.d});if(v!==undefined)n.v=v;if(w!==undefined)n.w=w;return n}
const L=[
['تحية وحركة',()=>[mk('say','مرحباً! أنا روبوت',2),mk('move',100),mk('say','تحركت 100 خطوة',2)]],
['رسم مربع بالتكرار',()=>[mk('pd'),mk('repeat',4,0,[mk('move',100),mk('right',90)])]],
['رقصة الروبوت',()=>[mk('repeat',4,0,[mk('move',30),mk('right',90),mk('say','أرقص!',0.5),mk('move',30),mk('left',90)])]],
['رسم نجمة خماسية',()=>[mk('pd'),mk('col','#e5484d'),mk('repeat',5,0,[mk('move',100),mk('right',144)])]]];
const find=(l,n)=>{if(l.includes(n))return l;for(const x of l){const r=find(x.kids,n);if(r)return r}return null};
const inside=(n,l)=>n.kids===l||n.kids.some(k=>inside(k,l));
const cnt=l=>l.reduce((a,n)=>a+1+cnt(n.kids),0);
function drop(list,before){
 if(!drag)return;let n;
 if(drag.t)n=mk(drag.t);else{n=drag.m;if(before===n||inside(n,list)){drag=null;return}const s=find(script,n);s.splice(s.indexOf(n),1)}
 list.splice(before?list.indexOf(before):list.length,0,n);drag=null;render()}
function blkEl(n){
 const d=D[n.t],e=document.createElement('div');
 e.className='blk'+(d.box?' cont':'');e.style.background=CAT[d.c][1];e.draggable=true;e.dataset.id=n.id;
 const hd=document.createElement('div');hd.className='hd';e.append(hd);
 d.p.forEach(x=>{
  if(typeof x==='string'){const s=document.createElement('span');s.textContent=x;hd.append(s)}
  else{let i;if(x.sp||x.bg){i=document.createElement('select');(x.sp?SP:BG).forEach((o,j)=>{const op=document.createElement('option');op.value=j;op.textContent=x.sp?o:o[0];i.append(op)})}else{i=document.createElement('input');i.type=x.col?'color':x.n?'number':'text'}i.value=n[x.k];
   i.oninput=()=>{n[x.k]=i.value;code()};i.onfocus=()=>e.draggable=false;i.onblur=()=>e.draggable=true;hd.append(i)}});
 const b=document.createElement('button');b.className='del';b.textContent='✕';b.title='حذف';
 b.onclick=ev=>{ev.stopPropagation();const l=find(script,n);l.splice(l.indexOf(n),1);render()};hd.append(b);
 if(d.box){const k=document.createElement('div');k.className='kids';n.kids.forEach(c=>k.append(blkEl(c)));
  k.ondragover=ev=>{ev.preventDefault();ev.stopPropagation();k.classList.add('drop')};
  k.ondragleave=()=>k.classList.remove('drop');
  k.ondrop=ev=>{ev.preventDefault();ev.stopPropagation();k.classList.remove('drop');drop(n.kids,null)};e.append(k)}
 e.ondragstart=ev=>{ev.stopPropagation();drag={m:n};ev.dataTransfer.setData('text/plain','b')};
 e.ondragover=ev=>{ev.preventDefault();ev.stopPropagation()};
 e.ondrop=ev=>{ev.preventDefault();ev.stopPropagation();drop(find(script,n),n)};
 return e}
function render(){
 run++;clearLit();const S=$('scr');S.innerHTML='';
 const h=document.createElement('div');h.className='blk hat';h.dataset.id=0;h.textContent='🏁 عند الضغط على العلم الأخضر';S.append(h);
 script.forEach(n=>S.append(blkEl(n)));
 if(!script.length){const p=document.createElement('p');p.className='mut';p.textContent='اسحب اللبنات إلى هنا أو انقر عليها من المكتبة.';S.append(p)}
 code()}
$('scr').ondragover=e=>e.preventDefault();
$('scr').ondrop=e=>{e.preventDefault();drop(script,null)};
const q=s=>JSON.stringify(String(s));
function gen(l,i){const p='  '.repeat(i),v='ijkl'[i%4];return l.map(n=>{switch(n.t){
 case'move':return p+`move(${+n.v});`;case'right':return p+`turnRight(${+n.v});`;case'left':return p+`turnLeft(${+n.v});`;
 case'home':return p+'goHome();';case'say':return p+`say(${q(n.v)}, ${+n.w});`;case'wait':return p+`wait(${+n.v});`;
 case'sprite':return p+`setSprite(${q(SP[+n.v])});`;case'bg':return p+`setBackground(${q(BG[+n.v][0])});`;case'pd':return p+'penDown();';case'pu':return p+'penUp();';case'col':return p+`penColor(${q(n.v)});`;case'clr':return p+'clearAll();';
 case'repeat':return p+`for (let ${v} = 0; ${v} < ${+n.v}; ${v}++) {\n`+gen(n.kids,i+1)+(n.kids.length?'\n':'')+p+'}'}}).join('\n')}
const fullCode=()=>'// عند الضغط على العلم الأخضر 🏁\n'+gen(script,0);
function code(){$('cd').textContent=fullCode();$('fc').textContent='عدد اللبنات: '+cnt(script)}
function pal(){const P=$('pal');P.innerHTML='';Object.keys(D).filter(t=>D[t].c===cur).forEach(t=>{const d=D[t],e=document.createElement('div');
 e.className='blk';e.style.background=CAT[d.c][1];e.draggable=true;e.textContent=d.p.map(x=>typeof x==='string'?x:x.col?'🎨':x.sp?'🐱':x.bg?'🖼️':x.d).join(' ');
 e.onclick=()=>{script.push(mk(t));render()};e.ondragstart=ev=>{drag={t};ev.dataTransfer.setData('text/plain','n')};P.append(e)})}
Object.keys(CAT).forEach(k=>{const b=document.createElement('button');b.className='btn cat'+(k===cur?' on':'');b.style.setProperty('--cc',CAT[k][1]);b.textContent=CAT[k][0];
 b.onclick=()=>{cur=k;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x===b));pal()};$('cats').append(b)});
document.querySelectorAll('.tabs .btn').forEach(b=>b.onclick=()=>{const s=b.dataset.t==='scr';$('scrw').hidden=!s;$('codw').hidden=s;
 document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.toggle('on',x===b))});
L.forEach((l,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=(i+1)+'. '+l[0];b.onclick=()=>load(i);$('les').append(b)});
function load(i){lesson=L[i][0];script=L[i][1]();render();reset()}
/* التنفيذ */
const W=480,H=360,cx=$('cv').getContext('2d'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function place(){const l=st.x/W*100+'%',t=st.y/H*100+'%';for(const e of[$('spr'),$('bub')]){e.style.left=l;e.style.top=t}$('rot').style.transform=`rotate(${st.a}deg)`}
function reset(){st={x:W/2,y:H/2,a:0,pen:false,col:BG[curBg][2]};cx.clearRect(0,0,W,H);$('bub').style.display='none';place()}
function lit(id,on){const e=document.querySelector(`#scr [data-id="${id}"]`);if(e)e.classList.toggle('active',on)}
function clearLit(){document.querySelectorAll('#scr .active').forEach(e=>e.classList.remove('active'))}
function seg(a,b,c,d){cx.strokeStyle=st.col;cx.lineWidth=3;cx.lineCap='round';cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.stroke()}
async function exec(l,t){for(const n of l){if(t!==run)return;lit(n.id,1);await step(n,t);lit(n.id,0)}}
async function turn(d,t){const N=12;for(let i=0;i<N;i++){if(t!==run)return;st.a+=d/N;place();await sleep(16)}await sleep(150)}
async function step(n,t){const v=+n.v||0;switch(n.t){
 case'move':{const sx=st.x,sy=st.y,r=st.a*Math.PI/180,tx=sx+Math.cos(r)*v,ty=sy+Math.sin(r)*v,N=24;
  for(let i=1;i<=N;i++){if(t!==run)return;const x=sx+(tx-sx)*i/N,y=sy+(ty-sy)*i/N;if(st.pen)seg(st.x,st.y,x,y);st.x=x;st.y=y;place();await sleep(16)}await sleep(150);break}
 case'right':await turn(v,t);break;case'left':await turn(-v,t);break;
 case'home':st.x=W/2;st.y=H/2;place();await sleep(300);break;
 case'say':$('bub').textContent=n.v;$('bub').style.display='block';await sleep((+n.w||0)*1000);$('bub').style.display='none';break;
 case'wait':await sleep(v*1000);break;
 case'sprite':setSp(+n.v);await sleep(300);break;case'bg':setBg(+n.v);await sleep(300);break;case'pd':st.pen=true;await sleep(300);break;case'pu':st.pen=false;await sleep(300);break;
 case'col':st.col=n.v;await sleep(300);break;case'clr':cx.clearRect(0,0,W,H);await sleep(300);break;
 case'repeat':if(n.kids.length)for(let i=0;i<Math.min(v,999);i++){if(t!==run)return;await exec(n.kids,t)}break}}
$('go').onclick=async()=>{const t=++run;clearLit();reset();lit(0,1);await sleep(300);lit(0,0);await exec(script,t);if(t===run)clearLit()};
$('stp').onclick=()=>{run++;clearLit();$('bub').style.display='none'};
/* بيانات المشروع */
const sumTxt=()=>{const c={};(function w(l){l.forEach(n=>{c[n.t]=(c[n.t]||0)+1;w(n.kids)})})(script);return Object.entries(c).map(([t,k])=>`${D[t].p[0]} ×${k}`).join('، ')||'—'};
$('pj').onclick=()=>{$('ln').value=lesson;$('bc').textContent=cnt(script);$('st').textContent='';$('ov').classList.add('on')};
$('cl').onclick=()=>$('ov').classList.remove('on');
$('ln').oninput=()=>lesson=$('ln').value;
$('wa').onclick=async()=>{
 let w=null;if($('sn').value.trim()&&$('ln').value.trim()){w=window.open('','_blank');if(w)try{w.opener=null}catch(e){}}
 const s=$('sn').value.trim(),l=$('ln').value.trim(),S=$('st');
 if(!s){S.textContent='⚠️ الرجاء كتابة اسم الطالب.';$('sn').focus();return}
 if(!l){S.textContent='⚠️ الرجاء كتابة اسم التدريب.';$('ln').focus();return}
 const name=(s+'-'+l).replace(/[\\\/:*?"<>|\s]+/g,'_')+'.json';
 const data=JSON.stringify({app:'scratch-ar',version:1,student:s,lesson:l,sprite:SP[curSp],background:BG[curBg][0],blockCount:cnt(script),createdAt:new Date().toISOString(),blocks:JSON.parse(JSON.stringify(script)),javascript:fullCode()},null,2);
 let ok=false;
 try{const dl=typeof claude!=='undefined'?await claude.use('downloads'):null;
  if(dl){await dl.save({filename:name,data});ok=true}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.append(a);a.click();a.remove();ok=true}
 }catch(e){}
 const msg=`📚 *مشروع سكراتش*\n👤 الطالب: ${s}\n📝 التدريب: ${l}\n🧱 عدد اللبنات: ${cnt(script)}\n📋 الملخص: ${sumTxt()}\n\n💻 الكود النصي (JavaScript):\n\`\`\`${fullCode()}\`\`\`\n\n📎 تنبيه: تم تنزيل الملف ${name} على جهازي، وسأرفقه في هذه المحادثة.`;
 const url='https://wa.me/?text='+encodeURIComponent(msg);
 S.innerHTML='';
 const p=document.createElement('div');p.textContent=ok?'✅ تم تنزيل ملف المشروع. لا تنسَ إرفاق الملف في محادثة واتساب.':'⚠️ لم يتم حفظ الملف (ربما ألغيت الحفظ). يمكنك إعادة المحاولة.';S.append(p);
 const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='إن لم يفتح واتساب تلقائياً اضغط هنا 📲';S.append(a);
 try{if(w)w.location.href=url;else window.open(url,'_blank')}catch(e){}};
